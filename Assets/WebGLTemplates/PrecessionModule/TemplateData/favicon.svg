<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Template thumbnail in the style of Unity's built-in PWA template:
    flat charcoal background (#231F20), white app bar (x 26–101, y 16–25),
    a bold, flat white symbol whose parts are separated only by gaps in the background colour.
    One accent: the red marker on the rotor rim.

    Geometry (128 grid):
      pivot (62,72); axle tilted 45° from vertical, length 34 → tip (86,48)
      disk centre at half the axle (74,60); disk frame rotate(45): local x in the disk plane,
      local y along the axle (−y = towards the tip); front face centre in world coords (76.5,57.5)
      precession path (back/upper half only, so it crosses nothing): ellipse centre (62,42), rx 24, ry 6.5,
      drawn from 200° to 338°, arrow head pointing towards the axle tip
    Export: any size (128 for Unity, 512 for previews).
  -->
  <rect width="128" height="128" fill="#231F20"/>

  <!-- app bar -->
  <rect x="26" y="16" width="76" height="10" fill="#fff"/>

  <!-- precession path with arrow head -->
  <!-- <path d="M 39.45 39.8 A 24 6.5 0 0 1 84.25 39.6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <polygon points="88.8,42.6 85.8,37.3 82.7,41.9" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/> -->

  <!-- stand as ONE continuous shape: base, tower, pivot ball and the start of the axle merge
       (a gap between ball and tower would read as the letter "i") -->
  <rect x="38" y="99" width="48" height="7" rx="3.5" fill="#fff"/>
  <rect x="58" y="72" width="8" height="29" fill="#fff"/>
  <circle cx="62" cy="72" r="5.6" fill="#fff"/>
  <line x1="62" y1="72" x2="74" y2="60" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- rotor disk in its own frame: rim (back face + side), red marker, front face cut free by a gap line -->
  <g transform="translate(74 60) rotate(45)">
    <ellipse cx="0" cy="3.5" rx="19" ry="7.5" fill="#fff"/>
    <rect x="-19" y="-3.5" width="38" height="7" fill="#fff"/>
    <!-- marker on the visible rim band; corners follow front edge −3.5+7.5√(1−x²/19²) and back edge +3.5+… -->
    <polygon points="6,3.62 6,10.62 10,9.88 10,2.88" fill="#e0192f"/>
    <ellipse cx="0" cy="-3.5" rx="19" ry="7.5" fill="#fff" stroke="#231F20" stroke-width="2.6"/>
    <!-- hub as negative space -->
    <circle cx="0" cy="-3.5" r="3" fill="#231F20"/>
  </g>

  <!-- axle, front part (hub → tip), cut free from the face by a background-coloured halo -->
  <line x1="78.2" y1="55.8" x2="86" y2="48" stroke="#231F20" stroke-width="8.6" stroke-linecap="round"/>
  <line x1="78.2" y1="55.8" x2="86" y2="48" stroke="#fff"    stroke-width="5"   stroke-linecap="round"/>
</svg>
